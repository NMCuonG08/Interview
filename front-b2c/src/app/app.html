<div class="shell">
  <header class="topbar">
    <div class="brand-block">
      <a routerLink="/store" class="brand-mark" aria-label="VHanDelivery Store">
        <span class="brand-icon">V</span>
        <span class="brand-copy">
          <strong>VHanDelivery</strong>
          <small>B2C Storefront</small>
        </span>
      </a>

      <nav class="main-nav" aria-label="Store navigation">
        <a
          routerLink="/store"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M3 10.5 12 3l9 7.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M5.5 9.5V20h13V9.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>Store</span>
        </a>
        <a routerLink="/checkout" routerLinkActive="active">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M7 4h12l-1.4 7.2a2 2 0 0 1-2 1.6H9.2a2 2 0 0 1-2-1.6L5.2 2.8A1 1 0 0 0 4.2 2H3"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle cx="10" cy="19" r="1.5" />
            <circle cx="17" cy="19" r="1.5" />
          </svg>
          <span>Checkout</span>
        </a>
      </nav>
    </div>

    <div class="right-group">
      <a routerLink="/cart" class="cart-anchor" aria-label="Open cart">
        <span class="cart-icon-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M4 5h2l2.2 9.2A2 2 0 0 0 10.1 16H18a2 2 0 0 0 1.9-1.5L21 8H7.1"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle cx="10" cy="20" r="1.5" />
            <circle cx="18" cy="20" r="1.5" />
          </svg>
          <span *ngIf="itemCount() > 0" class="cart-badge"
            >{{ cartLabel() }}</span
          >
        </span>
        <span class="cart-copy">
          <strong>Cart</strong>
          <small
            >{{ itemCount() }} item{{ itemCount() === 1 ? '' : 's' }}</small
          >
        </span>
      </a>

      <div class="auth-nav">
        <ng-container *ngIf="isAuthenticated(); else loginLink">
          <span class="user-label">{{ currentUser()?.email }}</span>
          <button type="button" class="logout-btn" (click)="logout()">
            Sign out
          </button>
        </ng-container>
        <ng-template #loginLink>
          <a routerLink="/login" class="login-link">Sign in</a>
        </ng-template>
      </div>
    </div>
  </header>

  <main class="page-content">
    <router-outlet></router-outlet>
  </main>
</div>
